[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transfergap"
version = "0.1.0"
description = "Auditable cross-embodiment robot transfer evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
transfergap = "transfergap.__main__:main"

[tool.setuptools.packages.find]
include = ["transfergap*"]
