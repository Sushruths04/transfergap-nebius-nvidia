# End-to-end check of the unified image on the GPU cluster (one Job, one GPU). Free. Needs the single GPU: scale deploy/tg-dev to 0 first and back
# to 1 afterwards (then run restore_tg_dev.sh in the pod). Volume paths: demo plan/npz and SONIC weights are NOT in the image.
#   kubectl scale deploy/tg-dev -n isaac-sim --replicas=0 ; kubectl apply -f docker/cluster/e2e-job.yaml ; kubectl logs -f job/tg-e2e -n isaac-sim
apiVersion: batch/v1
kind: Job
metadata: {name: tg-e2e, namespace: isaac-sim, labels: {project: transfergap}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {project: transfergap}}
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-L40S, kubernetes.io/hostname: srv-hpc-gpu04}
      imagePullSecrets: [{name: tg-ghcr}]
      containers:
      - name: e2e
        image: ghcr.io/sushruths04/transfergap:full-2026-10-06b
        imagePullPolicy: Always
        args: [e2e]
        env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
        - {name: TG_OUT, value: /ws/transfergap/e2e_out}
        - {name: DEMO_NPZ, value: /ws/transfergap/demos/pexels_8135753_notebook.npz}
        - {name: SONIC_WEIGHTS_SRC, value: /ws/transfergap/repo/GR00T-WholeBodyControl/gear_sonic_deploy}
        - {name: KAIROS_ASSETS, value: /ws/transfergap/kairos_assets}
        - {name: G1_SEEDS, value: "1200-1203"}
        - {name: HOME, value: /root}
        resources:
          requests: {cpu: "16", memory: 48Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: 1}
          limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/gpu: 1}
        volumeMounts: [{name: data, mountPath: /ws/transfergap}, {name: shm, mountPath: /dev/shm}]
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: tg-dev-data}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
